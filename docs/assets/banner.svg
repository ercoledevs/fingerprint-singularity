<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="448" viewBox="0 0 1280 448" role="img" aria-labelledby="title desc">
  <title id="title">Singularity — Identification Platform</title>
  <desc id="desc">The Singularity backoffice wordmark: concentric lime rings and pale green typography on a forest green background.</desc>
  <rect width="1280" height="448" fill="#132d28"/>
  <g transform="translate(348 98) scale(3.5)" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g fill="none" stroke="#b7e49e" stroke-width="2"><circle cx="17" cy="34" r="16"/><circle cx="17" cy="34" r="10.5"/></g>
    <text x="45" y="30" fill="#d7e7e1" font-size="24" font-weight="600" letter-spacing="-1">singularity</text>
    <g fill="#9eb8ae" font-size="8" font-weight="600" letter-spacing="1.6"><text x="45" y="50">IDENTIFICATION</text><text x="45" y="62">PLATFORM</text></g>
  </g>
</svg>
