name: fingerprint-singularity
services:
  mongo:
    image: mongo:8.0.16
    restart: unless-stopped
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25", "--bind_ip_all"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: bootstrap
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Run scripts/setup.py}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Run scripts/setup.py}
    volumes:
      - mongo_data:/data/db
      - ./deploy/mongo-init.js:/docker-entrypoint-initdb.d/init.js:ro
    networks: [database]
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ping:1}).ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 30
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://singularity:${MONGO_APP_PASSWORD}@mongo:27017/singularity?authSource=singularity
      SINGULARITY_SECRET: ${SINGULARITY_SECRET:?Run scripts/setup.py}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Run scripts/setup.py}
      ADMIN_USER: ${ADMIN_USER:-admin}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      DEMO_PUBLIC_KEY: ${DEMO_PUBLIC_KEY:?Run scripts/setup.py}
    depends_on:
      mongo: {condition: service_healthy}
    volumes: [identity_state:/state]
    networks: [database, frontend]
    mem_limit: 512m
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
  web:
    profiles: [web]
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    ports: ["${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:8080"]
    depends_on:
      api: {condition: service_healthy}
    networks: [frontend]
    mem_limit: 128m
  gateway:
    profiles: [headless]
    image: nginx:1.28.0-alpine
    restart: unless-stopped
    ports: ["${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:8080"]
    volumes: ["./deploy/headless.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on:
      api: {condition: service_healthy}
    networks: [frontend]
    mem_limit: 128m
volumes:
  mongo_data:
  identity_state:
networks:
  database: {internal: true}
  frontend:
