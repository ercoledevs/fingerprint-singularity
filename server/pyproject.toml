[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fingerprint-singularity-console"
version = "0.2.0"
description = "Self-hosted browser identification API and terminal console"
requires-python = ">=3.12"
dependencies = ["httpx==0.28.1", "rich==15.0.0"]

[project.optional-dependencies]
server = ["fastapi==0.142.2", "uvicorn==0.54.0", "pymongo==4.18.2"]
test = ["pytest==9.1.1"]

[project.scripts]
singularity = "singularity.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["singularity*"]
