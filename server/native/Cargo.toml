[package]
name = "singularity-native"
version = "0.4.0"
edition = "2021"
rust-version = "1.83"
license = "MIT"
description = "Native support/v3 validation and matching for fingerprint-singularity"

[lib]
name = "singularity_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "=0.29.3", features = ["extension-module", "abi3-py312"] }

[profile.release]
lto = "thin"
codegen-units = 1
